# GitHub Actions CI：Windows + Qt 6.10 (MSVC) 构建 + 单元测试
#
# 触发：push 到 main / 任何 feat 分支 / 任何 PR
# 说明：CMakeLists 的 CMAKE_PREFIX_PATH 硬编码了本机 Qt 路径，CI 用
#       -DCMAKE_PREFIX_PATH 覆盖（install-qt-action 输出的 qtpath）。
#       VS 生成器 + Ninja 由 VS 自带，无需额外安装构建工具链。
name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.10 (win64_msvc2022_64)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qtpath }}" `
            -DCMAKE_BUILD_TYPE=Release
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: pwsh

      - name: Run unit tests (ctest)
        run: ctest --test-dir build -C Release --output-on-failure
        shell: pwsh
